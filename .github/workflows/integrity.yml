name: Pybricks source integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify approved source manifest
        run: python tools/integrity.py verify
      - name: Check Python syntax
        run: python -m py_compile main.py base.py memoria.py saida_1.py saida_2.py saida_3.py saida_4.py saida_5.py saida_6.py saida_7.py saida_8.py
