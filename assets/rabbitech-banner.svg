      <path d="M30 64q17 12 34 0" stroke="#d8f8ff" fill="none"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="158" fill="#9cefff" font-size="21" font-weight="700" letter-spacing="8">JOÃO PESSOA · PARAÍBA · BRASIL</text>
    <text x="104" y="250" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="2">RABBITECH</text>
    <rect x="110" y="278" width="560" height="4" rx="2" fill="url(#neon)">
