    </rect>
    <text x="112" y="332" fill="#d9e8f7" font-size="27" letter-spacing="3">ROBÓTICA  ·  PROGRAMAÇÃO  ·  INOVAÇÃO</text>
    <text x="112" y="382" fill="#8ea9c7" font-size="19" letter-spacing="2">IDEIAS QUE GANHAM MOVIMENTO.</text>
