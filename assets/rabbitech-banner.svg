<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Rabbitech — Robótica e tecnologia</title>
  <desc id="desc">Banner tecnológico animado da Rabbitech, equipe de robótica de João Pessoa, Paraíba.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#101d36"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e5ff"/>
      <stop offset=".5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ffbd59"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#24d9ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#24d9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7db8e8" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#65dfff" opacity=".25"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)"/>
  <ellipse cx="1280" cy="220" rx="390" ry="260" fill="url(#glow)"/>
  <ellipse cx="1280" cy="220" rx="250" ry="120" fill="#4e67ff" opacity=".08" filter="url(#blur)"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65">
    <path d="M0 350H230l48-48h120l44-44h120"/>
    <path d="M1040 0v75l48 48h90l45 45h377"/>
    <path d="M1180 460v-55l55-55h110l40-40h215"/>
    <path d="M0 92h130l38 38h75"/>
  </g>
  <g fill="#54e5ff">
    <circle cx="230" cy="350" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="258" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="75" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1385" cy="350" r="4"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(1190 92)" stroke="url(#neon)" fill="none" stroke-width="3">
    <circle cx="150" cy="130" r="108" opacity=".32"/>
    <circle cx="150" cy="130" r="82" stroke-dasharray="7 12" opacity=".8">
      <animateTransform attributeName="transform" type="rotate" from="0 150 130" to="360 150 130" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="130" r="55" opacity=".65"/>
    <path d="M150 38v-24m0 232v-24M58 130H34m232 0h-24M85 65 68 48m164 164-17-17m0-130 17-17M85 195l-17 17" stroke-linecap="round"/>
    <g transform="translate(103 83)" stroke="#d8f8ff" stroke-width="4" stroke-linejoin="round">
      <rect x="5" y="12" width="84" height="70" rx="16" fill="#142d4b"/>
      <path d="M27 12V0m40 12V0M0 36h-15m119 0H89M26 82v18m42-18v18" stroke-linecap="round"/>
      <circle cx="30" cy="42" r="7" fill="#39e4ff" stroke="none"/>
